<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CryptoVault - Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/portfolio.css">
</head>
<body>
    <div class="app-layout">
        <!-- Top Header -->
        <header class="top-header">
            <div class="top-header-left">
                <a href="dashboard.html" class="btn-icon btn-secondary" style="width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;text-decoration:none;"><i class="fas fa-chevron-left"></i></a>
                <span class="page-title">Portfolio</span>
            </div>
            <div class="top-header-right">
                <button class="btn-icon btn-secondary" title="Help"><i class="fas fa-question-circle"></i></button>
                <button id="syncBtn" class="btn-icon btn-secondary" title="Sync"><i class="fas fa-sync-alt"></i></button>
            </div>
        </header>

        <main class="main-content">
            <!-- Wallet Holdings -->
            <div class="wallet-holdings-card" style="margin-bottom:24px;">
                <div class="card-header" style="padding:0 0 12px 0;">
                    <h3 class="card-title"><i class="fas fa-coins" style="color:var(--accent-primary)"></i> My Wallets</h3>
                    <span class="badge badge-gold" id="portfolioTotal">$0.00</span>
                </div>
                <div id="walletHoldingsList">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            </div>

            <!-- Filter Chips -->
            <div class="filter-chips">
                <button class="filter-chip active" data-coin="">All</button>
                <button class="filter-chip" data-coin="USDT">USDT</button>
                <button class="filter-chip" data-coin="BTC">BTC</button>
                <button class="filter-chip" data-coin="ETH">ETH</button>
                <button class="filter-chip" data-coin="SOL">SOL</button>
                <button class="filter-chip" data-coin="USDC">USDC</button>
            </div>

            <!-- My Positions -->
            <div style="margin-bottom:24px;">
                <div class="card-header" style="padding:0 0 12px 0;">
                    <h3 class="card-title"><i class="fas fa-wallet" style="color:var(--accent-primary)"></i> My Earn Positions</h3>
                    <span class="badge badge-gold" id="positionsTotal">$0.00</span>
                </div>
                <div id="positionsList" class="positions-grid">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            </div>

            <!-- Available Products -->
            <div>
                <div class="card-header" style="padding:0 0 12px 0;">
                    <h3 class="card-title"><i class="fas fa-star" style="color:var(--accent-primary)"></i> Available Products</h3>
                </div>
                <div class="search-bar">
                    <i class="fas fa-search search-bar-icon"></i>
                    <input type="text" id="productSearch" class="form-input search-input" placeholder="Search earn products...">
                </div>
                <div id="productsList" class="earn-grid">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            </div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="dashboard.html" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
            <a href="portfolio.html" class="nav-item active"><i class="fas fa-th-large"></i><span>Portfolio</span></a>
            <a href="transactions.html" class="nav-item"><i class="fas fa-exchange-alt"></i><span>Transactions</span></a>
            <a href="p2p.html" class="nav-item"><i class="fas fa-store"></i><span>P2P</span></a>
        </nav>
    </div>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/portfolio.js"></script>
</body>
</html>
