<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CryptoVault - Withdraw</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/withdraw.css">
</head>
<body>
    <div class="app-layout">
        <!-- Top Header -->
        <header class="top-header">
            <div class="top-header-left">
                <a href="dashboard.html" class="btn-icon btn-secondary" style="width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;text-decoration:none;"><i class="fas fa-chevron-left"></i></a>
                <span class="page-title">Withdraw</span>
            </div>
            <div class="top-header-right">
                <button class="btn-icon btn-secondary" title="Help"><i class="fas fa-question-circle"></i></button>
            </div>
        </header>

        <main class="main-content">
            <!-- Coin Selector -->
            <div class="selector-card">
                <label class="selector-label">Select Asset</label>
                <div class="asset-selector" id="assetSelector">
                    <div class="asset-option active" data-coin="USDT"><span class="coin-dot" style="background:#26a17b"></span> USDT</div>
                    <div class="asset-option" data-coin="BTC"><span class="coin-dot" style="background:#f7931a"></span> BTC</div>
                    <div class="asset-option" data-coin="ETH"><span class="coin-dot" style="background:#627eea"></span> ETH</div>
                    <div class="asset-option" data-coin="SOL"><span class="coin-dot" style="background:#9945ff"></span> SOL</div>
                    <div class="asset-option" data-coin="BNB"><span class="coin-dot" style="background:#f0b90b"></span> BNB</div>
                    <div class="asset-option" data-coin="XRP"><span class="coin-dot" style="background:#23292f"></span> XRP</div>
                    <div class="asset-option" data-coin="ADA"><span class="coin-dot" style="background:#0033ad"></span> ADA</div>
                    <div class="asset-option" data-coin="DOGE"><span class="coin-dot" style="background:#c3a634"></span> DOGE</div>
                    <div class="asset-option" data-coin="AVAX"><span class="coin-dot" style="background:#e84142"></span> AVAX</div>
                </div>
            </div>

            <!-- Network Selector -->
            <div class="selector-card">
                <label class="selector-label">Select Network</label>
                <div id="networkSelector" class="network-selector">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            </div>

            <!-- Withdrawal Form -->
            <div class="withdraw-form-card" id="withdrawFormCard" style="display:none;">
                <div class="form-group">
                    <label>Withdrawal Address</label>
                    <input type="text" id="withdrawAddress" class="form-input" placeholder="Enter wallet address">
                </div>
                <div class="form-group" id="tagGroup" style="display:none;">
                    <label>Memo / Tag</label>
                    <input type="text" id="withdrawTag" class="form-input" placeholder="Enter memo/tag (if required)">
                </div>
                <div class="form-group">
                    <label>Amount <span id="coinLabel" class="text-muted">(USDT)</span></label>
                    <div class="amount-input-row">
                        <input type="number" id="withdrawAmount" class="form-input" placeholder="0.00" step="any" min="0">
                        <button class="btn btn-ghost btn-sm" id="maxBtn">MAX</button>
                    </div>
                </div>
                <div class="withdraw-summary" id="withdrawSummary">
                    <div class="summary-row"><span>Network</span><span id="summaryNetwork">—</span></div>
                    <div class="summary-row"><span>Withdraw Fee</span><span id="summaryFee">—</span></div>
                    <div class="summary-row"><span>Min Withdraw</span><span id="summaryMin">—</span></div>
                    <div class="summary-row total"><span>You Receive</span><span id="summaryReceive">—</span></div>
                </div>
                <button class="btn btn-primary btn-block" id="withdrawBtn">
                    <i class="fas fa-paper-plane"></i> Withdraw
                </button>
            </div>

            <!-- Warning -->
            <div class="warning-card">
                <i class="fas fa-exclamation-triangle"></i>
                <div>
                    <strong>Double-check everything</strong>
                    <p>Ensure the address and network are correct. Withdrawals to wrong addresses or networks cannot be recovered.</p>
                </div>
            </div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="dashboard.html" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
            <a href="portfolio.html" class="nav-item"><i class="fas fa-th-large"></i><span>Portfolio</span></a>
            <a href="transactions.html" class="nav-item"><i class="fas fa-exchange-alt"></i><span>Transactions</span></a>
            <a href="p2p.html" class="nav-item"><i class="fas fa-store"></i><span>P2P</span></a>
        </nav>
    </div>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/withdraw.js"></script>
</body>
</html>
