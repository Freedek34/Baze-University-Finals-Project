<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CryptoVault - Buy with NGN</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/deposit.css">
</head>
<body>
    <div class="app-layout">
        <header class="top-header">
            <div class="top-header-left">
                <a href="dashboard.html" class="btn-icon btn-secondary" style="width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;text-decoration:none;"><i class="fas fa-chevron-left"></i></a>
                <span class="page-title">Buy with NGN</span>
            </div>
        </header>

        <main class="main-content">
            <div id="formSection">
                <div class="deposit-step-card">
                    <div class="form-group">
                        <label>Asset to Buy</label>
                        <select id="buyCoin" class="form-input">
                            <option value="USDT">USDT</option>
                            <option value="BTC">BTC</option>
                            <option value="ETH">ETH</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Amount (NGN)</label>
                        <input type="number" id="fiatAmount" class="form-input" placeholder="e.g. 50000" step="any" min="1000">
                    </div>
                    <div id="estimateRow" class="modal-info" style="border:none;padding:8px 0;">
                        <span class="text-muted">You receive ≈</span>
                        <span id="cryptoEstimate" class="text-gold">—</span>
                    </div>
                    <div class="form-group">
                        <label>Card Number</label>
                        <input type="text" id="cardNumber" class="form-input" placeholder="4111 1111 1111 1111" maxlength="19" inputmode="numeric">
                    </div>
                    <div class="card-form-row">
                        <div class="form-group">
                            <label>Expiry</label>
                            <input type="text" id="cardExpiry" class="form-input" placeholder="MM/YY" maxlength="5">
                        </div>
                        <div class="form-group">
                            <label>CVV</label>
                            <input type="password" id="cardCvv" class="form-input" placeholder="123" maxlength="4">
                        </div>
                    </div>
                    <button id="payBtn" class="btn btn-primary btn-block" style="margin-top:8px;">
                        <i class="fas fa-lock"></i> Pay Securely
                    </button>
                </div>
                <p class="text-muted text-center" style="font-size:0.75rem;">
                    <i class="fas fa-shield-alt"></i> Demo mode — no real charges. Visa & Mastercard supported.
                </p>
            </div>

            <div id="successSection" style="display:none;">
                <div class="success-card deposit-step-card">
                    <div class="success-icon"><i class="fas fa-check"></i></div>
                    <h3>Payment Approved</h3>
                    <p id="successMessage">Your crypto has been credited.</p>
                    <a href="dashboard.html" class="btn btn-primary btn-block">Back to Home</a>
                </div>
            </div>
        </main>

        <div id="processingModal" class="loading-modal">
            <div class="spinner"></div>
            <p>Processing your payment...</p>
        </div>
    </div>
    <script src="../js/config.js?v=20250609b"></script>
    <script src="../js/api.js?v=20250609b"></script>
    <script src="../js/utils.js?v=20250609b"></script>
    <script src="../js/deposit-ngn.js?v=20250609b"></script>
</body>
</html>
