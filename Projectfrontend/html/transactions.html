<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CryptoVault - Transactions</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/transactions.css">
</head>
<body>
    <div class="app-layout">
        <!-- Top Header -->
        <header class="top-header">
            <div class="top-header-left">
                <a href="dashboard.html" class="btn-icon btn-secondary" style="width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;text-decoration:none;"><i class="fas fa-chevron-left"></i></a>
                <span class="page-title">Transactions</span>
            </div>
            <div class="top-header-right">
                <button class="btn-icon btn-secondary" title="Help"><i class="fas fa-question-circle"></i></button>
                <button class="btn-icon btn-secondary" title="Filter"><i class="fas fa-sliders-h"></i></button>
            </div>
        </header>

        <main class="main-content">
            <!-- Quick Action Buttons -->
            <div class="tx-actions">
                <a href="transfer.html" class="tx-action-btn">
                    <div class="action-icon"><i class="fas fa-arrow-up"></i></div>
                    <span>Send</span>
                </a>
                <a href="receive.html" class="tx-action-btn">
                    <div class="action-icon"><i class="fas fa-arrow-down"></i></div>
                    <span>Receive</span>
                </a>
                <a href="withdraw.html" class="tx-action-btn">
                    <div class="action-icon"><i class="fas fa-money-bill-wave"></i></div>
                    <span>Withdraw</span>
                </a>
                <a href="p2p.html" class="tx-action-btn">
                    <div class="action-icon"><i class="fas fa-exchange-alt"></i></div>
                    <span>P2P</span>
                </a>
            </div>

            <!-- Filter -->
            <div class="tx-filter-bar">
                <select id="filterType" class="form-input">
                    <option value="">All Types</option>
                    <option value="credit">Incoming</option>
                    <option value="debit">Outgoing</option>
                </select>
                <select id="filterTxType" class="form-input">
                    <option value="">All Categories</option>
                    <option value="transfer">Transfers</option>
                    <option value="deposit">Deposits</option>
                    <option value="withdrawal">Withdrawals</option>
                </select>
            </div>

            <!-- Transaction Cards -->
            <div id="transactionsList">
                <div class="loading"><div class="spinner"></div></div>
            </div>

            <!-- Pagination -->
            <div class="pagination">
                <button id="prevPage" class="btn btn-secondary btn-sm" disabled><i class="fas fa-chevron-left"></i></button>
                <span id="pageInfo" class="text-muted" style="font-size:0.85rem;">Page 1</span>
                <button id="nextPage" class="btn btn-secondary btn-sm"><i class="fas fa-chevron-right"></i></button>
            </div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="dashboard.html" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
            <a href="portfolio.html" class="nav-item"><i class="fas fa-th-large"></i><span>Portfolio</span></a>
            <a href="transactions.html" class="nav-item active"><i class="fas fa-exchange-alt"></i><span>Transactions</span></a>
            <a href="p2p.html" class="nav-item"><i class="fas fa-store"></i><span>P2P</span></a>
        </nav>
    </div>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/transactions.js"></script>
</body>
</html>
